<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEREK – Gluténmentes Pékség</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Kodchasan',sans-serif;
      min-height:100vh;
      background:#064C48;
      display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;
    }
    /* Pöttyes textúra */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:radial-gradient(circle,rgba(255,255,255,0.07) 1.5px,transparent 1.5px);
      background-size:28px 28px;
      pointer-events:none;z-index:0;
    }
    .container{position:relative;z-index:1;text-align:center;padding:40px 20px;max-width:480px;width:100%}
    .logo{margin-bottom:12px}
    .logo img{height:100px;width:auto}
    .tagline{color:rgba(255,255,255,0.7);font-size:0.85rem;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:48px}
    .cards{display:flex;flex-direction:column;gap:14px}
    .card{
      background:white;border-radius:16px;padding:20px 24px;
      display:flex;align-items:center;gap:16px;
      cursor:pointer;text-decoration:none;color:inherit;
      transition:transform 0.15s,box-shadow 0.15s;
      box-shadow:0 4px 20px rgba(0,0,0,0.15);
    }
    .card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.22)}
    .card-icon{font-size:2rem;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
    .card-icon.teal{background:#e0f2ef}
    .card-icon.gold{background:#fef3cd}
    .card-icon.purple{background:#f0e8ff}
    .card-text{text-align:left}
    .card-title{font-size:1rem;font-weight:600;color:#064C48;margin-bottom:2px;font-family:'Kodchasan',sans-serif}
    .card-sub{font-size:0.78rem;color:#6b8a88}
    .footer{margin-top:36px;color:rgba(255,255,255,0.4);font-size:0.72rem}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="img/logo_white_horiz.png" alt="KEREK">
    </div>
    <div class="tagline">My Health. My Value!</div>
    
    <div class="cards">
      <a class="card" href="vevo.html">
        <div class="card-icon teal">🛒</div>
        <div class="card-text">
          <div class="card-title">Megrendelő felület</div>
          <div class="card-sub">Vevőknek – havi rendelés leadása</div>
        </div>
      </a>
      <a class="card" href="admin.html">
        <div class="card-icon gold">👩‍💼</div>
        <div class="card-text">
          <div class="card-title">Admin felület</div>
          <div class="card-sub">Rendelések, vevők, termékek kezelése</div>
        </div>
      </a>
      <a class="card" href="receptura.html">
        <div class="card-icon purple">📋</div>
        <div class="card-text">
          <div class="card-title">Receptúra modul</div>
          <div class="card-sub">Receptek, alapanyagok, gyártás tervezés</div>
        </div>
      </a>
    </div>
    
    <div class="footer" id="app-footer">KEREK Gluténmentes Pékség · komsacsongor.github.io/kerek-rendeles · <span id="version-display">v2.12.1</span></div>
  </div>
<script src="kerek-constants.js?v=2.19.9"></script>
<script>
  const vd = document.getElementById('version-display');
  if(vd && typeof APP_VERSION !== 'undefined') vd.textContent = APP_VERSION;
</script>
</body>
</html>
