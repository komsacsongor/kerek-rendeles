<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEREK – Regisztráció</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Kodchasan:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kerek-styles.css?v=2.21.0">
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--teal-dark); padding:16px; }
  .reg-card { background:white; border-radius:20px; padding:36px 32px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  .reg-logo { text-align:center; margin-bottom:24px; }
  .reg-logo img { width:72px; }
  .reg-logo .brand { font-family:'Fraunces',serif; font-size:2rem; color:var(--teal-dark); letter-spacing:0.05em; display:block; margin-top:8px; }
  .reg-logo .sub { font-size:0.78rem; color:var(--text-soft); letter-spacing:0.12em; text-transform:uppercase; }
  .field { margin-bottom:16px; }
  .field label { font-size:0.82rem; font-weight:600; color:var(--teal-dark); display:block; margin-bottom:6px; }
  .field input { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:0.95rem; font-family:'Kodchasan',sans-serif; box-sizing:border-box; transition:border-color 0.2s; }
  .field input:focus { outline:none; border-color:var(--teal); }
  .btn-reg { width:100%; padding:14px; background:var(--teal-dark); color:var(--gold); border:none; border-radius:12px; font-size:1rem; font-weight:700; font-family:'Kodchasan',sans-serif; cursor:pointer; margin-top:8px; transition:opacity 0.2s; }
  .btn-reg:hover { opacity:0.9; }
  .btn-reg:disabled { opacity:0.5; cursor:not-allowed; }
  .error { background:#fef2f2; color:#dc2626; border-radius:8px; padding:10px 14px; font-size:0.85rem; margin-bottom:14px; display:none; }
  .success-box { text-align:center; }
  .success-box .code { font-family:monospace; font-size:1.8rem; font-weight:700; color:var(--teal-dark); background:var(--teal-pale); border:2px dashed var(--teal); border-radius:12px; padding:16px 24px; margin:16px 0; letter-spacing:0.1em; }
  .success-box .copy-btn { background:var(--teal-pale); border:1.5px solid var(--teal); color:var(--teal-dark); border-radius:8px; padding:8px 20px; cursor:pointer; font-family:'Kodchasan',sans-serif; font-weight:600; font-size:0.85rem; }
  .success-box .note { font-size:0.8rem; color:var(--text-soft); margin-top:12px; line-height:1.5; }
  .invalid-inv { text-align:center; padding:20px; }
  .invalid-inv .icon { font-size:3rem; margin-bottom:12px; }
</style>
</head>
<body>
<div class="reg-card" id="reg-card">
  <div class="reg-logo">
    <img src="Asset_63x.png" alt="KEREK">
    <span class="brand">KEREK</span>
    <span class="sub">Vevői regisztráció</span>
  </div>
  <div id="error-box" class="error"></div>
  <div id="reg-form">
    <div class="field">
      <label>Teljes neve *</label>
      <input type="text" id="reg-name" placeholder="pl. Kovács Anna" autocomplete="name">
    </div>
    <div class="field">
      <label>Email cím (opcionális)</label>
      <input type="email" id="reg-email" placeholder="pl. anna@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Telefonszám (opcionális)</label>
      <input type="tel" id="reg-phone" placeholder="pl. +40 745 289 063" autocomplete="tel">
    </div>
    <button class="btn-reg" id="reg-btn" onclick="submitRegistration()">
      Regisztráció & Belépési kód igénylése →
    </button>
  </div>
  <div id="success-box" class="success-box" style="display:none">
    <div style="font-size:2rem;margin-bottom:8px">🎉</div>
    <div style="font-weight:700;font-size:1.1rem;color:var(--teal-dark);font-family:'Fraunces',serif">Sikeresen regisztráltál!</div>
    <div style="font-size:0.85rem;color:var(--text-soft);margin:8px 0 4px">Ez a te belépési kódod:</div>
    <div class="code" id="success-code"></div>
    <button class="copy-btn" onclick="copyCode()">📋 Kód másolása</button>
    <div class="note">
      Mentsd el ezt a kódot – ezzel tudsz bejelentkezni a KEREK megrendelő felületre.<br><br>
      A KEREK pékség hamarosan jóváhagyja a hozzáférésedet.
    </div>
    <a href="vevo.html" style="display:inline-block;margin-top:16px;color:var(--teal-dark);font-weight:600;font-size:0.9rem">→ Megrendelő megnyitása</a>
  </div>

</div>

<script src="supabase.js?v=2.21.0"></script>
<script src="kerek-constants.js?v=2.21.0"></script>
<script>
async function init() {
  // Open registration - no token needed
  // Admin approves after registration (active=false gate)
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
}

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const seg = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  return `KER-${seg()}-${seg()}`;
}

async function submitRegistration() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();

  if (!name) { showError('Kérjük add meg a neved!'); return; }

  const btn = document.getElementById('reg-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Feldolgozás...';
  document.getElementById('error-box').style.display = 'none';

  try {
    // Generate unique client ID from name
    const baseId = name.toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[áàä]/g, 'a').replace(/[éèë]/g, 'e')
      .replace(/[íì]/g, 'i').replace(/[óöő]/g, 'o').replace(/[úüű]/g, 'u')
      .replace(/[^a-z0-9-]/g, '').substring(0, 20);
    const code = genCode();
    const clientId = `${baseId}-${code.slice(-4).toLowerCase()}`;

    // Insert client - use generated code as ID (KER-XXXX-XXXX format)
    // Note: pending status stored in name prefix until admin approves
    await sb.insert('clients', {
      id: code,
      name: '[PENDING] ' + name,
      email: email || null,
      phone: phone || null,
    });
    // Store real name for display
    window._regRealName = name;

    // Show success
    document.getElementById('reg-form').style.display = 'none';
    document.getElementById('success-code').textContent = code;
    document.getElementById('success-box').style.display = 'block';

  } catch(e) {
    showError('Hiba a regisztráció során: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Regisztráció & Belépési kód igénylése →';
  }
}

function copyCode() {
  const code = document.getElementById('success-code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    document.querySelector('.copy-btn').textContent = '✅ Másolva!';
    setTimeout(() => document.querySelector('.copy-btn').textContent = '📋 Kód másolása', 2000);
  });
}

init();
</script>
</body>
</html>
