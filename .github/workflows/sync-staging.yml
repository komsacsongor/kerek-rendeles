name: Sync Production → Staging

# v2.41.0: heti adatklónozás production → staging
# Cron: minden vasárnap 4:00 UTC
# Manuális trigger: workflow_dispatch
#
# Secrets:
#  - SUPABASE_PROD_DB_URL: production DB connection string (Session pooler)
#  - SUPABASE_STAGING_DB_URL: staging DB connection string (Session pooler)
#
# Lépések:
#  1. pg_dump --data-only --schema=public a production-ről
#  2. TRUNCATE minden public schema táblát staging-en (séma marad)
#  3. INSERT az adatok staging-be
#  4. ANONIMIZÁCIÓ: vevő-email/telefon randomizálva GDPR miatt

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
          psql --version

      - name: Dump production data
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          pg_dump \
            --no-owner \
            --no-acl \
            --data-only \
            --schema=public \
            --disable-triggers \
            "$PROD_DB_URL" > prod_data.sql
          echo "✅ Dump complete: $(wc -l < prod_data.sql) lines, $(du -h prod_data.sql | cut -f1)"

      - name: Truncate staging tables (preserve schema)
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" <<'SQL'
          DO $$
          DECLARE
            r RECORD;
          BEGIN
            FOR r IN (
              SELECT tablename FROM pg_tables WHERE schemaname = 'public'
            ) LOOP
              EXECUTE 'TRUNCATE TABLE public.' || quote_ident(r.tablename) || ' RESTART IDENTITY CASCADE';
            END LOOP;
          END $$;
          SQL
          echo "✅ Truncated all public schema tables on staging"

      - name: Restore data into staging
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=0 < prod_data.sql > restore.log 2>&1 || true
          echo "Restore log (last 30 lines):"
          tail -30 restore.log
          echo "✅ Restore step finished (some COPY errors are normal — non-existent tables)"

      - name: Anonymize sensitive data (GDPR)
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" <<'SQL'
          UPDATE clients
          SET
            email = 'staging_user_' || id || '@example.com',
            phone = '+40000000000'
          WHERE name NOT LIKE '[DELETED]%';

          DELETE FROM push_subscriptions;

          INSERT INTO audit_log (action, entity_name, details, created_at)
          VALUES (
            'staging_sync',
            'system',
            'Auto-sync production → staging, anonimizációval.',
            NOW()
          );
          SQL
          echo "✅ Anonymization complete"

      - name: Summary
        run: |
          echo "═══════════════════════════════════════════"
          echo "✅ Staging sync completed at $(date -u)"
          echo "Cron schedule: heti vasárnap 4:00 UTC"
          echo "═══════════════════════════════════════════"
