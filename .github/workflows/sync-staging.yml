name: Sync Production → Staging

# v2.41.0: heti production → staging klónozás (séma + adatok együtt)
# Cron: vasárnap 4:00 UTC | Manuális: workflow_dispatch
#
# Mit klónoz:
#  - Teljes public schema (séma + adatok)
#  - Edge Functions: külön workflow (deploy-edge-functions.yml)
#  - Auth users / Storage: NEM klónozódik (külön kezelés)
#
# Anonimizáció: clients.email + phone (GDPR)

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump production (schema + data, with --clean)
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump \
            --no-owner \
            --no-acl \
            --schema=public \
            --clean \
            --if-exists \
            "$PROD_DB_URL" > prod_full.sql
          echo "✅ Dump: $(wc -l < prod_full.sql) lines, $(du -h prod_full.sql | cut -f1)"

      - name: Restore into staging (drops + recreates everything in public schema)
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$STAGING_DB_URL" \
            -v ON_ERROR_STOP=0 \
            < prod_full.sql > restore.log 2>&1 || true
          echo "=== Restore log tail ==="
          tail -40 restore.log
          echo "=== Error count ==="
          grep -c "ERROR" restore.log || echo "0 errors"

      - name: Force PostgREST schema cache reload
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$STAGING_DB_URL" -c "NOTIFY pgrst, 'reload schema';"
          echo "✅ Schema cache reload signal sent"

      - name: Restore Supabase default permissions for anon/authenticated
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$STAGING_DB_URL" <<'SQL'
          -- Supabase default grants — a pg_dump --clean elvesztette ezeket
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;
          NOTIFY pgrst, 'reload schema';
          SQL
          echo "✅ Permissions restored, schema cache reload signal sent"

      - name: Anonymize sensitive data (GDPR)
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/psql "$STAGING_DB_URL" <<'SQL'
          UPDATE clients
          SET
            email = 'staging_user_' || id || '@example.com',
            phone = '+40000000000'
          WHERE name NOT LIKE '[DELETED]%';

          DELETE FROM push_subscriptions;

          -- USER PREFERENCE: a tulajdonos saját email-jét megtartjuk (kvázi "exception")
          UPDATE clients SET email = 'komsa.csongor@gmail.com' WHERE id = 'KER-WVGR-ZFPT';

          INSERT INTO audit_log (action, entity_name, details, created_at)
          VALUES (
            'staging_sync',
            'system',
            'Full schema + data sync. Vevő emailek/telefon randomizálva.',
            NOW()
          );
          SQL
          echo "✅ Anonymization done"

      - name: Summary
        run: |
          echo "═══════════════════════════════════════════"
          echo "✅ Staging full sync completed at $(date -u)"
          echo "═══════════════════════════════════════════"
