name: Deploy Edge Functions

# Csak akkor fut, ha az EF forrása változik. main → prod projekt, staging → staging projekt.
# Kell hozzá 1 GitHub secret: SUPABASE_ACCESS_TOKEN (Supabase account → Access Tokens).
on:
  push:
    branches: [main, staging]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy-ef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy admin-data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            REF=lfaxeihrmiylggahougl   # PROD
          else
            REF=xgcwxlwjlohzbzpcapnw   # STAGING
          fi
          echo "Deploy admin-data → $REF"
          supabase functions deploy admin-data --project-ref "$REF"
