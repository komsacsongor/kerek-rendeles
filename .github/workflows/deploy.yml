name: Deploy to GitHub Pages

# v2.41.0: dual-branch deploy
#  - main → / (production)
#  - staging → /staging/ (staging environment)
# Egy deploy-futás a teljes Pages site-ot építi: main a root-ba + staging a
# /staging/ subdir-ba (mind a kettő egy artifact-ban).
#
# v2.45.1: a github-pages környezet védelmi szabálya csak a main branchről enged
# deploy-t. Ezért a staging PUSH NEM indítja a deploy-t (különben elutasítás +
# hibás e-mail). A staging tartalom frissítése a main-en futó workflow_dispatch-csel
# történik (a SKILL 15.4 szerinti curl), ami szintén felteszi a /staging/ subdir-t.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Védelem: a github-pages környezetbe csak main / dispatch deployolhat (staging push kihagyva)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch (production)
        uses: actions/checkout@v5
        with:
          ref: main
          path: site

      - name: Checkout staging branch into site/staging/
        uses: actions/checkout@v5
        with:
          ref: staging
          path: site/staging
        continue-on-error: true

      - name: Remove nested .git from staging dir
        run: rm -rf site/staging/.git site/staging/.github

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
