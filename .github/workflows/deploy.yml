name: Deploy to GitHub Pages

# v2.41.0: dual-branch deploy
#  - main → / (production)
#  - staging → /staging/ (staging environment)
# Mindkét branch push ugyanazt csinálja: a teljes Pages site újraépítése
# main a root-ba + staging a /staging/ subdir-ba (mind a kettő egy artifact-ban).

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout staging branch into site/staging/
        uses: actions/checkout@v4
        with:
          ref: staging
          path: site/staging
        continue-on-error: true

      - name: Remove nested .git from staging dir
        run: rm -rf site/staging/.git site/staging/.github

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
