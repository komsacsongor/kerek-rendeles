<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>KEREK – UX modellek prototípus</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Kodchasan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --teal-dark:#064C48; --teal:#129990; --teal-mid:#43AAA0; --teal-light:#A3D1C6; --teal-pale:#E0F2EF;
  --gold-dark:#B78029; --gold:#EFB036; --gold-light:#EBCF9E; --sand:#EABD6C;
  --cream:#FAF7F0; --text:#1A2E31; --text-soft:#5A7A80; --border:#C8DDD9;
}
* { box-sizing: border-box; }
body { margin:0; background:#e8eceb; font-family:'Kodchasan',sans-serif; color:var(--text); }
.phone-frame {
  max-width: 420px; margin: 20px auto; background: #fff;
  min-height: 90vh; border-radius: 24px; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  display: flex; flex-direction: column;
}
.demo-header {
  background: var(--teal-dark); color: #fff; padding: 14px 18px;
  font-family:'Fraunces',serif; font-size: 1.1rem;
}
.demo-header .sub { font-size:.7rem; opacity:.8; font-family:'Kodchasan',sans-serif; margin-top: 4px; }

/* Toggle bar */
.model-toggle {
  display: flex; gap: 4px; padding: 10px; background: var(--cream);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30;
}
.model-toggle button {
  flex: 1; padding: 8px 6px; border: 1.5px solid var(--border); background: #fff;
  border-radius: 8px; font-family: 'Kodchasan', sans-serif; font-size: 0.75rem;
  font-weight: 500; cursor: pointer; color: var(--text-soft); transition: all 0.15s;
}
.model-toggle button.active {
  background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 700;
}

.content { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 80px; }

/* Sticky bottom bar */
.sticky-total {
  position: sticky; bottom: 0; background: var(--teal-dark); color: #fff;
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  font-family: 'Kodchasan', sans-serif; box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
  margin: 0 -12px -12px;
}
.sticky-total .total-val { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 700; color: var(--gold); }
.sticky-total .sub { font-size: 0.7rem; opacity: 0.7; }

/* ===== A modell – Day-stacked ===== */
.A-day-card {
  background:#fff; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden;
}
.A-day-head { padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.A-day-head.baking { background: linear-gradient(135deg, var(--teal-pale), #fff); }
.A-day-name { font-family:'Fraunces',serif; font-size:1.05rem; color:var(--teal-dark); font-weight:600; }
.A-badge { background: var(--gold); color:#fff; padding:3px 9px; border-radius:6px; font-size:.72rem; font-weight:700; }
.A-day-body { display:none; padding:0 14px 14px; }
.A-day-body.open { display:block; }
.A-cat-chips { display:flex; flex-wrap:wrap; gap:5px; padding:8px 0; border-bottom:1px solid var(--border); margin-bottom:8px; }
.A-cat-chip { padding:4px 10px; border-radius:14px; border:1.5px solid var(--border); background:#fff; font-size:.72rem; cursor:pointer; }
.A-cat-chip.active { background: var(--teal); color:#fff; border-color: var(--teal); font-weight:700; }
.A-product-row { display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--border); align-items:center; }
.A-prod-info { flex: 1; }
.A-prod-name { font-weight: 600; font-size: .88rem; color: var(--text); }
.A-prod-meta { font-size: .72rem; color: var(--text-soft); }
.A-qty-ctrl { display:flex; align-items:center; gap:6px; }
.A-qty-btn { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--teal); background:#fff; color:var(--teal); font-weight:700; cursor:pointer; }
.A-qty-display { min-width: 30px; text-align: center; font-weight: 600; font-size: .9rem; }
.A-qty-display.has { color: var(--teal); }
.A-day-total { display:flex; justify-content:space-between; margin-top:10px; padding-top:8px; border-top:2px solid var(--teal-light); font-size:.85rem; font-weight:600; color: var(--teal-dark); }

/* Eltelt szekció (A & B & C közös) */
.elapsed-section { margin-bottom:14px; }
.elapsed-head { background:#f3f4f6; border-radius:10px; padding:10px 14px; display:flex; justify-content:space-between; cursor:pointer; border:1px solid #e5e7eb; }
.elapsed-body { display:none; padding:8px 0 0; }
.elapsed-body.open { display:block; }
.elapsed-day { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:6px; opacity:.85; display:flex; justify-content:space-between; gap:8px; font-size:.82rem; }
.elapsed-day .name { font-weight:600; color:var(--text-soft); }
.elapsed-day .badge { background:#dcfce7; color:#166534; padding:3px 8px; border-radius:6px; font-size:.68rem; font-weight:600; white-space:nowrap; }

/* ===== B modell – Single-day focus ===== */
.B-day-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:12px; border-bottom:2px solid var(--border); }
.B-day-tab { flex-shrink: 0; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; min-width: 70px; text-align: center; }
.B-day-tab.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.B-day-tab.past { opacity: 0.5; background: #f3f4f6; }
.B-day-tab .dow { font-size: .7rem; opacity: .8; }
.B-day-tab .date { font-family:'Fraunces',serif; font-size: 1.1rem; font-weight: 700; }
.B-day-info { background: linear-gradient(135deg, var(--teal-pale), #fff); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
.B-day-info .title { font-family:'Fraunces',serif; color: var(--teal-dark); font-size: 1.1rem; font-weight: 600; }
.B-day-info .sub { font-size: .75rem; color: var(--text-soft); margin-top: 2px; }
.B-cat-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.B-cat-chip { padding:6px 12px; border-radius:16px; border:1.5px solid var(--border); background:#fff; font-size:.78rem; cursor:pointer; }
.B-cat-chip.active { background: var(--teal); color:#fff; border-color: var(--teal); font-weight:700; }
.B-product-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; display:flex; gap:12px; align-items:center; }
.B-prod-name { font-weight:600; font-size:.92rem; }
.B-prod-meta { font-size: .72rem; color: var(--text-soft); margin-top: 2px; }
.B-nav-buttons { display:flex; gap:8px; margin-top:14px; }
.B-nav-buttons button { flex:1; padding:10px; border:1.5px solid var(--teal); background:#fff; color:var(--teal); border-radius:10px; font-weight:600; cursor:pointer; font-family:'Kodchasan',sans-serif; }

/* ===== C modell – Product-pivot ===== */
.C-cat-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); position: sticky; top: 60px; background: #fff; padding-top:8px; z-index: 5; }
.C-cat-chip { padding:6px 12px; border-radius:16px; border:1.5px solid var(--border); background:#fff; font-size:.78rem; cursor:pointer; }
.C-cat-chip.active { background: var(--teal); color:#fff; border-color: var(--teal); font-weight:700; }
.C-product-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
.C-prod-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.C-prod-name { font-weight:600; font-size:.95rem; }
.C-prod-meta { font-size:.72rem; color:var(--text-soft); }
.C-prod-total { font-family:'Fraunces',serif; color: var(--teal-dark); font-weight: 600; font-size: .9rem; }
.C-day-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.C-day-cell { background: var(--cream); border-radius: 8px; padding: 8px 4px; text-align: center; border: 1px solid var(--border); }
.C-day-cell.past { opacity: 0.55; background: #f3f4f6; }
.C-day-cell .label { font-size: .65rem; color: var(--text-soft); text-transform: uppercase; }
.C-day-cell .date { font-family: 'Fraunces', serif; font-weight: 700; color: var(--teal-dark); font-size: .9rem; margin-bottom: 4px; }
.C-day-cell .qty-ctrl { display: flex; gap: 3px; align-items: center; justify-content: center; }
.C-day-cell .qty-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--teal); background: #fff; color: var(--teal); font-weight: 700; cursor: pointer; font-size: .9rem; padding: 0; line-height: 1; }
.C-day-cell .qty-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.C-day-cell .qty-display { min-width: 18px; font-weight: 600; font-size: .85rem; }
.C-day-cell.past .qty-btn { display: none; }

.section-title { font-family: 'Fraunces', serif; font-size: 1rem; color: var(--teal-dark); margin: 12px 0 8px; }
.note { background: #fef9e7; border-left: 4px solid var(--gold); padding: 8px 12px; font-size: .78rem; color: #856404; border-radius: 4px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="demo-header">
    KEREK – UX modellek
    <div class="sub">Mockup – nem éles adat. Próbáld ki mindhárom nézetet!</div>
  </div>

  <div class="model-toggle">
    <button id="btn-A" class="active" onclick="switchModel('A')">📅 A: Napi</button>
    <button id="btn-B" onclick="switchModel('B')">📋 B: Single-day</button>
    <button id="btn-C" onclick="switchModel('C')">📦 C: Termék</button>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
// ===== MOCK DATA =====
const PRODUCTS = [
  {id:1, name:'Fehér kenyér', weight:'1000g', price:32, category:'Kenyerek'},
  {id:2, name:'Magvas kenyér', weight:'800g', price:38, category:'Kenyerek'},
  {id:3, name:'Sós perec', weight:'80g', price:8, category:'Sós'},
  {id:4, name:'Kifli', weight:'60g', price:5, category:'Sós'},
  {id:5, name:'Finomszelet', weight:'200g', price:18, category:'Édes'},
  {id:6, name:'Pasta tészta', weight:'500g', price:24, category:'Tészta'},
];

const BAKING_DAYS = [
  {day: 19, dow: 'K', past: true,  status: 'fulfilled'},
  {day: 22, dow: 'P', past: true,  status: 'fulfilled'},
  {day: 26, dow: 'K', past: false, locked: true},
  {day: 29, dow: 'P', past: false, locked: false},
  {day: 30, dow: 'Sz', past: false, locked: false},
];

// State
const orders = {
  19: {1: 1, 3: 2},
  22: {1: 1, 5: 2},
  26: {1: 1},
  29: {},
  30: {}
};
let currentModel = 'A';
let elapsedOpen = false;
let openDaysA = new Set([26, 29]);
let categoryByDayA = {}; // {day: cat}
let categoryB = 'all';
let categoryC = 'all';
let currentDayB = 26;

const CATS = ['Kenyerek', 'Sós', 'Édes', 'Tészta'];

function totalForDay(day) {
  return Object.values(orders[day]||{}).reduce((a,b)=>a+b, 0);
}
function valForDay(day) {
  return Object.entries(orders[day]||{}).reduce((acc, [pid, q]) => {
    const p = PRODUCTS.find(x => x.id == pid);
    return acc + (p ? p.price * q : 0);
  }, 0);
}
function monthTotal() {
  return BAKING_DAYS.reduce((acc, d) => acc + valForDay(d.day), 0);
}
function monthQty() {
  return BAKING_DAYS.reduce((acc, d) => acc + totalForDay(d.day), 0);
}

function changeQty(day, pid, delta) {
  if (!orders[day]) orders[day] = {};
  const cur = orders[day][pid] || 0;
  const next = Math.max(0, cur + delta);
  if (next > 0) orders[day][pid] = next;
  else delete orders[day][pid];
  render();
}

function switchModel(m) {
  currentModel = m;
  document.querySelectorAll('.model-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
  render();
}

// ===== A modell =====
function renderA() {
  const past = BAKING_DAYS.filter(d => d.past);
  const cur = BAKING_DAYS.filter(d => !d.past);

  let html = '';

  // Eltelt szekció
  if (past.length) {
    html += `<div class="elapsed-section">
      <div class="elapsed-head" onclick="elapsedOpen=!elapsedOpen;render()">
        <span style="font-weight:600;color:var(--text-soft);font-size:.85rem">🕰 Eltelt sütési napok (${past.length})</span>
        <span style="color:var(--text-soft)">${elapsedOpen?'▴':'▾'}</span>
      </div>
      <div class="elapsed-body ${elapsedOpen?'open':''}">
        ${past.map(d => `<div class="elapsed-day">
          <div><div class="name">🔥 ${d.dow}, ${d.day}.</div>
          <div style="font-size:.72rem;color:var(--text-soft)">${totalForDay(d.day)} db · ${valForDay(d.day)} lej</div></div>
          <span class="badge">🎉 Elkészült</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Aktív napok
  cur.forEach(d => {
    const isOpen = openDaysA.has(d.day) || totalForDay(d.day) > 0;
    const dayCat = categoryByDayA[d.day] || 'all';
    const prods = dayCat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === dayCat);
    html += `<div class="A-day-card">
      <div class="A-day-head baking" onclick="toggleA(${d.day})">
        <div><div class="A-day-name">🔥 ${d.dow}, ${d.day}.</div>
        ${d.locked?'<div style="font-size:.7rem;color:var(--gold-dark)">⏰ 24h határidő</div>':''}</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${totalForDay(d.day)>0 ? `<span class="A-badge">${totalForDay(d.day)} db</span>` : ''}
          <span style="color:var(--teal-mid);font-size:.85rem">${isOpen?'▴':'▾'}</span>
        </div>
      </div>
      <div class="A-day-body ${isOpen?'open':''}">
        <div class="A-cat-chips">
          <button class="A-cat-chip ${dayCat==='all'?'active':''}" onclick="event.stopPropagation();categoryByDayA[${d.day}]='all';render()">🧺 Összes</button>
          ${CATS.map(c => `<button class="A-cat-chip ${dayCat===c?'active':''}" onclick="event.stopPropagation();categoryByDayA[${d.day}]='${c}';render()">${c}</button>`).join('')}
        </div>
        ${prods.map(p => `<div class="A-product-row">
          <div class="A-prod-info">
            <div class="A-prod-name">${p.name}</div>
            <div class="A-prod-meta">${p.weight} · ${p.price} lej</div>
          </div>
          <div class="A-qty-ctrl">
            <button class="A-qty-btn" onclick="changeQty(${d.day},${p.id},-1)">−</button>
            <span class="A-qty-display ${(orders[d.day]?.[p.id]||0)>0?'has':''}">${orders[d.day]?.[p.id]||0}</span>
            <button class="A-qty-btn" onclick="changeQty(${d.day},${p.id},1)">＋</button>
          </div>
        </div>`).join('')}
        ${totalForDay(d.day)>0?`<div class="A-day-total"><span>Napi össz.</span><span>${totalForDay(d.day)} db · ${valForDay(d.day)} lej</span></div>`:''}
      </div>
    </div>`;
  });
  return html;
}

function toggleA(day) {
  if (openDaysA.has(day)) openDaysA.delete(day);
  else openDaysA.add(day);
  render();
}

// ===== B modell – Single-day focus =====
function renderB() {
  const day = BAKING_DAYS.find(d => d.day === currentDayB);
  if (!day) return '<div class="note">Nincs kiválasztott nap.</div>';
  const prods = categoryB === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === categoryB);

  let html = `<div class="B-day-tabs">${BAKING_DAYS.map(d =>
    `<button class="B-day-tab ${d.day===currentDayB?'active':''} ${d.past?'past':''}" onclick="currentDayB=${d.day};render()">
      <div class="dow">${d.dow}</div><div class="date">${d.day}</div>
    </button>`).join('')}</div>`;

  html += `<div class="B-day-info">
    <div class="title">🔥 ${day.dow}, május ${day.day}. ${day.past?'(eltelt)':''}</div>
    <div class="sub">${day.past?`Rendelt: ${totalForDay(day.day)} db · ${valForDay(day.day)} lej`:`${day.locked?'⏰ 24h határidő':'Aktív sütési nap'}`}</div>
  </div>`;

  html += `<div class="B-cat-chips">
    <button class="B-cat-chip ${categoryB==='all'?'active':''}" onclick="categoryB='all';render()">🧺 Összes</button>
    ${CATS.map(c => `<button class="B-cat-chip ${categoryB===c?'active':''}" onclick="categoryB='${c}';render()">${c}</button>`).join('')}
  </div>`;

  if (day.past) {
    html += `<div class="note">Eltelt nap — csak olvasható nézet</div>`;
  }

  html += prods.map(p => `<div class="B-product-card">
    <div style="flex:1">
      <div class="B-prod-name">${p.name}</div>
      <div class="B-prod-meta">${p.weight} · ${p.price} lej</div>
    </div>
    ${day.past ? `<div style="font-weight:600;color:var(--teal)">${orders[day.day]?.[p.id]||0} db</div>` : `
    <div class="A-qty-ctrl">
      <button class="A-qty-btn" onclick="changeQty(${day.day},${p.id},-1)">−</button>
      <span class="A-qty-display ${(orders[day.day]?.[p.id]||0)>0?'has':''}">${orders[day.day]?.[p.id]||0}</span>
      <button class="A-qty-btn" onclick="changeQty(${day.day},${p.id},1)">＋</button>
    </div>`}
  </div>`).join('');

  // Nav
  const idx = BAKING_DAYS.findIndex(d => d.day === currentDayB);
  const prev = idx > 0 ? BAKING_DAYS[idx-1] : null;
  const next = idx < BAKING_DAYS.length-1 ? BAKING_DAYS[idx+1] : null;
  html += `<div class="B-nav-buttons">
    <button ${!prev?'disabled':''} onclick="${prev?`currentDayB=${prev.day};render()`:''}">← ${prev?prev.dow+' '+prev.day:'—'}</button>
    <button ${!next?'disabled':''} onclick="${next?`currentDayB=${next.day};render()`:''}">${next?next.dow+' '+next.day:'—'} →</button>
  </div>`;
  return html;
}

// ===== C modell – Product-pivot =====
function renderC() {
  const prods = categoryC === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === categoryC);

  let html = `<div class="C-cat-chips">
    <button class="C-cat-chip ${categoryC==='all'?'active':''}" onclick="categoryC='all';render()">🧺 Összes</button>
    ${CATS.map(c => `<button class="C-cat-chip ${categoryC===c?'active':''}" onclick="categoryC='${c}';render()">${c}</button>`).join('')}
  </div>`;

  html += `<div class="note">📦 Termék-elsődleges nézet: minden terméknél azonnal látod mind a sütési napokat egy mini-rácsban.</div>`;

  html += prods.map(p => {
    const totalProdQty = BAKING_DAYS.reduce((acc, d) => acc + (orders[d.day]?.[p.id]||0), 0);
    return `<div class="C-product-card">
      <div class="C-prod-head">
        <div>
          <div class="C-prod-name">${p.name}</div>
          <div class="C-prod-meta">${p.weight} · ${p.price} lej</div>
        </div>
        ${totalProdQty>0 ? `<div class="C-prod-total">${totalProdQty} db · ${totalProdQty*p.price} lej</div>` : ''}
      </div>
      <div class="C-day-grid">
        ${BAKING_DAYS.map(d => {
          const qty = orders[d.day]?.[p.id] || 0;
          return `<div class="C-day-cell ${d.past?'past':''}">
            <div class="label">${d.dow}</div>
            <div class="date">${d.day}</div>
            ${d.past ? `<div style="font-weight:600;color:var(--text-soft)">${qty}</div>` : `
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(${d.day},${p.id},-1)">−</button>
              <span class="qty-display">${qty}</span>
              <button class="qty-btn" onclick="changeQty(${d.day},${p.id},1)">＋</button>
            </div>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  return html;
}

// ===== Render =====
function render() {
  const c = document.getElementById('content');
  let body = '';
  if (currentModel === 'A') body = renderA();
  else if (currentModel === 'B') body = renderB();
  else body = renderC();

  c.innerHTML = body + `<div class="sticky-total">
    <div><div class="sub">Havi össz.</div><div style="font-weight:600">${monthQty()} db</div></div>
    <div class="total-val">${monthTotal()} lej</div>
  </div>`;
}

render();
</script>
</body>
</html>
